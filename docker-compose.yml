services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./charts:/app/charts
    environment:
      - GEONAMES_USERNAME=${GEONAMES_USERNAME}
      - POCKETBASE_EMAIL=${POCKETBASE_EMAIL}
      - POCKETBASE_PASSWORD=${POCKETBASE_PASSWORD}
      - ASTRONOMY_APP_ID=${ASTRONOMY_APP_ID}
      - ASTRONOMY_APP_SECRET=${ASTRONOMY_APP_SECRET}
      # Geocoder connection settings
      # Option 1: Use HTTP instead of HTTPS (bypasses SSL issues entirely)
      - GEOCODER_USE_HTTP=false
      # Option 2: Use HTTPS without SSL verification (for self-signed certs)
      - GEOCODER_VERIFY_SSL=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
